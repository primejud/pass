<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#14141f" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="stylesheet" href="style.css" />
    <title>Passphrase Generator</title>
  </head>
  <body>
    <main class="container">
      <header>
        <h1>🔐 Passphrase Generator</h1>
        <p class="subtitle">Pick your words. We'll do the rest.</p>
      </header>

      <!-- Length selector -->
      <section class="length-row" aria-label="Passphrase length">
        <span id="lengthLabel" class="length-label">Words in passphrase</span>
        <div class="stepper" role="group" aria-labelledby="lengthLabel">
          <button
            class="step-btn"
            id="btnMinus"
            type="button"
            aria-label="Decrease word count"
          >
            −
          </button>
          <output class="step-value" id="lengthValue" aria-live="polite"
            >2</output
          >
          <button
            class="step-btn"
            id="btnPlus"
            type="button"
            aria-label="Increase word count"
          >
            +
          </button>
        </div>
      </section>

      <!-- Strength -->
      <section class="strength" aria-label="Estimated strength">
        <div class="meter" aria-hidden="true">
          <div class="meter-bar" id="meterBar" data-level="1"></div>
        </div>
        <div class="strength-text">
          <span id="strengthLabel">Weak</span>
          <span id="strengthBits" class="muted">~0 bits</span>
        </div>
        <p class="strength-hint" id="strengthHint"></p>
      </section>

      <!-- Progress -->
      <div class="progress" aria-live="polite">
        <div class="dots" id="dots" aria-hidden="true"></div>
        <span
          ><span id="basketCount">0</span> /
          <span id="basketTotal">2</span> words selected</span
        >
      </div>

      <!-- Word card -->
      <section class="word-card" aria-label="Current word">
        <div
          class="word-display"
          id="wordDisplay"
          aria-live="polite"
          aria-atomic="true"
        >
          Ready
        </div>
        <div class="word-meta" id="wordMeta"></div>
      </section>

      <div class="actions">
        <button class="btn btn-add" id="btnAdd" type="button">
          👍 Add <kbd>Y</kbd>
        </button>
        <button class="btn btn-skip" id="btnSkip" type="button">
          👎 Skip <kbd>N</kbd>
        </button>
      </div>
      <div class="secondary-actions">
        <button class="btn btn-ghost" id="btnBack" type="button">
          ↩ Undo <kbd>B</kbd>
        </button>
        <button class="btn btn-ghost" id="btnRestart" type="button">
          🔄 Restart <kbd>R</kbd>
        </button>
      </div>

      <!-- Result -->
      <section
        id="resultArea"
        class="result-box"
        hidden
        aria-labelledby="resultLabel"
      >
        <div class="result-label" id="resultLabel">✅ Your passphrase</div>
        <div class="passphrase" id="passphraseText"></div>
        <div class="result-note" id="copyNote"></div>
        <div class="result-actions">
          <button class="btn btn-ghost" id="btnCopy" type="button">
            📋 Copy again
          </button>
          <button class="btn btn-primary" id="btnNew" type="button">
            ✨ Make another <kbd>Enter</kbd>
          </button>
        </div>
      </section>

      <!-- Session history -->
      <section class="history-wrap" aria-labelledby="historyTitle">
        <div class="history-head">
          <h2 id="historyTitle">📜 This session (last 20)</h2>
          <div class="history-tools">
            <button class="link-btn" id="btnReveal" type="button">
              Reveal
            </button>
            <button class="link-btn danger" id="btnClear" type="button">
              Clear
            </button>
          </div>
        </div>
        <div class="history" id="historyList"></div>
      </section>

      <p class="footer">
        🔒 Generated locally in your browser. Nothing is sent or stored. Session
        history disappears when you close or refresh this page.
      </p>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="words.js"></script>
    <script src="app.js"></script>
  </body>
</html>
